apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oci-js-kata-executor
  namespace: oci-js-execution
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oci-js-kata-executor
  namespace: oci-js-execution
subjects:
  - kind: ServiceAccount
    name: oci-js-host
    namespace: oci-js-host
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oci-js-kata-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oci-js-kata-cleanup
  namespace: oci-js-execution
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oci-js-kata-cleanup
  namespace: oci-js-execution
subjects:
  - kind: ServiceAccount
    name: oci-js-kata-reconciler
    namespace: oci-js-host
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oci-js-kata-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oci-js-kata-preflight
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oci-js-kata-preflight
subjects:
  - kind: ServiceAccount
    name: oci-js-host
    namespace: oci-js-host
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oci-js-kata-preflight
