[project]
name = "oracle.oci-e2e-tests"
version = "0.1.3"
description = "OCI MCP Servers e2e tests"
readme = "README.md"
requires-python = ">=3.13"
license = "UPL-1.0"
license-files = ["LICENSE.txt"]
dependencies = [
    "behave>=1.2.6",
    "oci==2.185.1",
    "flask>=3.1.3",
    "cryptography>=50.0.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-bdd>=6.1.1",
    "pytest-cov>=7.0.0",
]
