name: Lint
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      MOON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      MOON_HEAD: ${{ github.sha }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0
    - name: Setup Moon
      uses: ./.github/actions/setup-moon
    - name: Lint and check uv locks with Moon
      run: moon ci --include-relations :lint :lock-check
