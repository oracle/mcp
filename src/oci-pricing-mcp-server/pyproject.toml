[project]
name = "oracle.oci-pricing-mcp-server"
version = "0.2.0"
description = "OCI Pricing MCP Server"
readme = "README.md"
license = "UPL-1.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Oracle MCP", email = "237432095+oracle-mcp@users.noreply.github.com"},
]
requires-python = ">=3.11"
dependencies = [
  "fastmcp==3.4.10",
  "httpx>=0.27.0",
  "babel>=2.10",
  "pycountry>=22.3.5",
]

classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
"oracle.oci-pricing-mcp-server" = "oracle.oci_pricing_mcp_server.server:main"
oci-pricing-mcp = "oracle.oci_pricing_mcp_server.server:main"

[project.urls]
Changelog = "https://github.com/oracle/mcp/blob/main/src/oci-pricing-mcp-server/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]
exclude = ["/oracle/**/tests/**"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.coverage*",
  "/.superpowers/**",
  "/htmlcov/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/.venv/**",
  "/venv/**",
  "/dist/**",
  "/build/**",
  "/uv.lock",
  "/moon.yml",
  "**/__pycache__/**",
  "**/*.py[cod]",
  "/.DS_Store",
  "/.env",
  "/.env.*",
  "/.claude/**",
  "/.cline/**",
  "/.roo/**",
  "/.cursor/**",
  "/mcp_settings*.json",
  "/Containerfile",
  "/.containerignore",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E","F","I","UP","B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["oracle/oci_pricing_mcp_server/tests"]
addopts = "--cov=oracle.oci_pricing_mcp_server --cov-branch --cov-report=term-missing"
markers = ["integration: explicitly selected live public Price List API probes"]

[tool.coverage.run]
branch = true
omit = [
    "**/__init__.py",
    "**/tests/**",
    "oci-pricing-mcp-server.py",
    "dist/*",
    ".venv/*",
]

[tool.coverage.report]
precision = 2
fail_under = 90
