[project]
name = "oracle.oci-speech-mcp-server"
version = "1.0.0"
description = "MCP server for OCI Speech transcription, speech synthesis, customizations, and job notifications"
readme = "README.md"
requires-python = ">=3.13"
license = "UPL-1.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Oracle MCP", email = "237432095+oracle-mcp@users.noreply.github.com"},
]
dependencies = [
    "fastmcp==3.4.5",
    "oci==2.182.1",
    "oracle-mcp-common>=0.1.0,<0.2.0",
    "pydantic>=2.13.4,<3",
]

classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
"oracle.oci-speech-mcp-server" = "oracle.oci_speech_mcp_server.server:main"

[project.urls]
Changelog = "https://github.com/oracle/mcp/blob/main/src/oci-speech-mcp-server/CHANGELOG.md"
Documentation = "https://github.com/oracle/mcp/tree/main/src/oci-speech-mcp-server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]
exclude = ["/oracle/**/tests/**"]

[tool.uv.sources]
oracle-mcp-common = { workspace = true }

[tool.uv.workspace]
members = ["../common"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]

[tool.coverage.run]
branch = true
omit = [
    "**/__init__.py",
    "**/tests/*",
    "dist/*",
    ".venv/*",
]

[tool.coverage.report]
omit = [
    "**/__init__.py",
    "**/tests/*",
]
precision = 2
fail_under = 90

[tool.pytest.ini_options]
addopts = "--cov=oracle.oci_speech_mcp_server --cov-report=term-missing"
testpaths = ["oracle/oci_speech_mcp_server/tests"]
