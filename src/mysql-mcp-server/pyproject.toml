[project]
name = "oracle.mysql-mcp-server"
version = "1.0.8"
description = "MySql Service MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = "UPL-1.0"
license-files = ["LICENSE.txt"]

dependencies = [
    "fastmcp==3.4.5",
    "keyring==25.7.0",
    "mysql-connector-python==9.5.0",
    "oci==2.185.1"
]

classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
"oracle.mysql_mcp_server" = "oracle.mysql_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]
exclude = ["/oracle/**/tests/**"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.coverage*",
  "/htmlcov/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/.venv/**",
  "/venv/**",
  "/dist/**",
  "/build/**",
  "/uv.lock",
  "/moon.yml",
  "**/__pycache__/**",
  "**/*.py[cod]",
  "/.DS_Store",
  "/.env",
  "/.env.*",
  "/.claude/**",
  "/.cline/**",
  "/.roo/**",
  "/.cursor/**",
  "/mcp_settings*.json",
  "/Containerfile",
  "/.containerignore",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["oracle/mysql_mcp_server/tests"]
addopts = "--cov=oracle/mysql_mcp_server --cov-branch --cov-report=term-missing"
markers = ["live: requires explicit MYSQL_MCP_RUN_LIVE_TESTS=1 and disposable database/OCI resources"]

[tool.coverage.run]
omit = ["**/tests/*"]

[tool.coverage.report]
precision = 2
fail_under = 90
