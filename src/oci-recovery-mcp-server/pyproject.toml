[project]
name = "oracle.oci-recovery-mcp-server"
version = "3.0.0"
description = "OCI Recovery Service MCP server"
readme = "README.md"
requires-python = ">=3.13"
license = "UPL-1.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Oracle MCP", email = "237432095+oracle-mcp@users.noreply.github.com"},
]
dependencies = [
    "cachetools==7.1.8",
    "cryptography==50.0.1",
    "fastmcp==3.4.5",
    "oci==2.185.1",
    "pydantic==2.13.4",
    "oracle-mcp-common>=0.1.2,<0.2.0",
]

classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
"oracle.oci-recovery-mcp-server" = "oracle.oci_recovery_mcp_server.server:main"

[project.urls]
Changelog = "https://github.com/oracle/mcp/blob/main/src/oci-recovery-mcp-server/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]
exclude = ["/oracle/**/tests/**"]

[tool.uv.sources]
oracle-mcp-common = { workspace = true }

[tool.uv.workspace]
members = [
    "../common",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.coverage*",
  "/htmlcov/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/.venv/**",
  "/venv/**",
  "/dist/**",
  "/build/**",
  "/uv.lock",
  "/moon.yml",
  "**/__pycache__/**",
  "**/*.py[cod]",
  "/.DS_Store",
  "/.env",
  "/.env.*",
  "/.claude/**",
  "/.cline/**",
  "/.roo/**",
  "/.cursor/**",
  "/mcp_settings*.json",
  # Local-only live-integration suite: needs real credentials, is never part of a
  # release, and its run logs contain tenancy data.
  "/integration_tests/**",
  "/Containerfile",
  "/.containerignore",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["oracle/oci_recovery_mcp_server/tests"]
norecursedirs = ["integration_tests"]

[tool.coverage.run]
omit = [
    "**/__init__.py",
    "**/tests/*",
    "**/integration_tests/*",
    "dist/*",
    ".venv/*",
]

[tool.coverage.report]
omit = ["**/integration_tests/*"]
precision = 2
fail_under = 90
