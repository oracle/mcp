[project]
name = "oracle-mcp-common"
version = "0.1.3"
description = "Shared utilities for Oracle MCP Python servers"
readme = "README.md"
requires-python = ">=3.13"
license = "UPL-1.0"
authors = [
    {name = "Oracle MCP", email = "237432095+oracle-mcp@users.noreply.github.com"},
]
dependencies = [
    "fastmcp>=3.2.4,<4.0.0",
    "oci>=2.179.0",
]

classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Documentation = "https://github.com/oracle/mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle_mcp_common"]
exclude = ["/oracle_mcp_common/tests/**"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.coverage*",
  "/htmlcov/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/.venv/**",
  "/venv/**",
  "/dist/**",
  "/build/**",
  "/uv.lock",
  "**/__pycache__/**",
  "**/*.py[cod]",
  "/.DS_Store",
  "/.env",
  "/.env.*",
  "/.claude/**",
  "/.cline/**",
  "/.roo/**",
  "/.cursor/**",
  "/mcp_settings*.json",
  "/Containerfile",
  "/.containerignore",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["oracle_mcp_common/tests"]

[tool.coverage.run]
branch = true
omit = ["**/__init__.py", "**/tests/*", "dist/*", ".venv/*"]

[tool.coverage.report]
omit = ["**/__init__.py", "**/tests/*"]
precision = 2
fail_under = 90
