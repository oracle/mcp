workspace:
  inheritedTasks:
    exclude:
      - 'containerize'

tasks:
  compile:
    description: 'Generates protobuf bindings and compiles the npm entry point'
    type: 'build'
    script: 'rm -rf dist && buf generate && tsc -p tsconfig.build.json'
    inputs:
      - 'src/**/*'
      - '!src/generated/**/*'
      - 'proto/**/*'
      - 'buf.gen.yaml'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
    outputs:
      - 'src/generated/**/*'
      - 'dist/**/*.js'

  test:
    description: 'Runs unit and MCP integration tests with coverage'
    type: 'test'
    command: 'c8 node --no-node-snapshot --experimental-strip-types --test test/*.test.ts'
    deps:
      - 'compile'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'package.json'
      - 'package-lock.json'

  check:
    description: 'Checks TypeScript types'
    command: 'tsc --noEmit'
    deps:
      - 'compile'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'

  build:
    description: 'Builds the npm package tarball'
    type: 'build'
    script: 'rm -f dist/*.tgz && npm pack --pack-destination dist'
    deps:
      - 'compile'
    inputs:
      - 'src/**/*'
      - 'proto/**/*'
      - 'buf.gen.yaml'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'LICENSE.txt'
      - 'Containerfile'
      - 'Containerfile.host'
      - 'examples/**/*'
      - 'docs/**/*'
      - 'scripts/**/*'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
    outputs:
      - 'dist/*.tgz'
    options:
      cache: false

  check-kubernetes-manifests:
    description: 'Validates standard and Kata Kubernetes manifests'
    type: 'test'
    command: 'node --no-node-snapshot --experimental-strip-types --test test/kata-manifests.test.ts test/kubernetes-manifests.test.ts'
    inputs:
      - 'examples/kata-kubernetes/**/*'
      - 'examples/kubernetes/**/*'
      - 'test/kata-manifests.test.ts'
      - 'test/kubernetes-manifests.test.ts'

  kubectl-dry-run-kubernetes:
    description: 'Runs offline kubectl client-side validation for Kubernetes manifests'
    type: 'run'
    command: 'node --no-node-snapshot --experimental-strip-types scripts/kubectl-dry-run-kubernetes.ts'
    inputs:
      - 'examples/kata-kubernetes/**/*'
      - 'examples/kubernetes/**/*'
      - 'scripts/kubectl-dry-run-kubernetes.ts'
    options:
      cache: false
      runInCI: false

  runner-build:
    description: 'Builds the Podman runner image'
    type: 'run'
    command: 'podman build --pull -t localhost/oci-javascript-mcp-runner:dev .'
    options:
      cache: false
      runInCI: false

  publish:
    description: 'Uploads the release-built npm package'
    type: 'run'
    inputs:
      - 'package.json'
    script: |
      if [ "$RELEASE_PUBLISH" != "1" ]; then
        echo 'Publish requires the release workflow' >&2
        exit 1
      fi
      npm publish dist/*.tgz --registry=https://registry.npmjs.org/
    options:
      cache: false
      runInCI: false
