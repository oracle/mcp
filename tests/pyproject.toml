[project]
name = "oracle.oci-e2e-tests"
version = "0.1.3"
description = "OCI MCP Servers e2e tests"
readme = "README.md"
requires-python = ">=3.13"
license = "UPL-1.0"
license-files = ["LICENSE.txt"]
dependencies = [
    "behave>=1.2.6",
    "fastmcp==3.4.10",
    "oci==2.185.1",
    "flask>=3.1.3",
    "cryptography>=50.0.0",
    "ollama-mcp-bridge>=0.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-bdd>=6.1.1",
    "pytest-cov>=7.0.0",
]

[tool.uv]
# Override the bridge's FastAPI pin to support patched Starlette.
override-dependencies = [
    "fastapi==0.135.0",
]
constraint-dependencies = [
    "starlette>=1.3.1,<2",
]
