version: v2
clean: true
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-ts_proto
    out: src/generated
    opt:
      - outputServices=grpc-js
      - env=node
      - enumsAsLiterals=true
      - useOptionals=messages
      - outputJsonMethods=false
      - outputPartialMethods=false
      - importSuffix=.ts
