name: Build and Test
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
permissions:
  contents: read
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      MOON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      MOON_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26.8.1'
          package-manager-cache: false

      - name: Install pinned Moon
        run: |
          moon_version=$(sed -n 's/^moon = "=\([0-9][0-9.]*\)"$/\1/p' .prototools)
          test -n "$moon_version"
          npm install --global --ignore-scripts "@moonrepo/cli@$moon_version"

      - name: Install Moon toolchains
        run: moon setup

      - name: Run Moon CI
        run: |
          moon ci --include-relations :lint :lock-check :install-check :test :check :build
          if compgen -G '.coverage.*' > /dev/null; then
            moon run root:combine-coverage
          fi

      - name: Upload combined coverage report
        if: ${{ hashFiles('.coverage') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: all-in-one-coverage-report
          path: |
            htmlcov/**/*
            src/*/htmlcov/**/*
            .coverage
          include-hidden-files: true
