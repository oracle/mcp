name: Build and Test
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
permissions:
  contents: read
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26.8.1'
          package-manager-cache: false

      - name: Install pinned Moon
        run: |
          moon_version=$(sed -n 's/^moon = "=\([0-9][0-9.]*\)"$/\1/p' .prototools)
          test -n "$moon_version"
          npm install --global --ignore-scripts "@moonrepo/cli@$moon_version"

      - name: Run Moon CI
        run: |
          moon run root:lint :lock-check :install-check \
            oci-javascript-mcp-server:test \
            oci-javascript-mcp-server:check \
            oci-javascript-mcp-server:build
          moon run root:combine-coverage

      - name: Upload combined coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: all-in-one-coverage-report
          path: |
            htmlcov/**/*
            src/*/htmlcov/**/*
            .coverage
          include-hidden-files: true
