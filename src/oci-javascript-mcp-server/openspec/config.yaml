schema: spec-driven

context: |
  Project: OCI JavaScript MCP Server.
  Stack: strict TypeScript with NodeNext, Node 26+ native TypeScript stripping,
  npm, the official MCP TypeScript SDK, OCI JavaScript SDK (`oci-sdk` and
  `oci-common`), Zod, `isolated-vm`, and c8.
  Transport: MCP over stdio. `run_javascript` executes a complete JavaScript
  program with an SDK-shaped `oci` facade; `discover_oci` inspects installed SDK
  declarations without running guest code.

  Architecture: `src/server.ts` runs the trusted MCP host and creates the sole
  `PodmanIsolationProvider`, optionally configured with the Podman CLI path and
  runner image environment variables. `src/sandbox.ts` starts one fresh provider
  execution per tool call, owns deadlines, call and concurrency budgets, and
  validates the returned result. The provider starts a locked-down Podman
  container running `src/sandbox-worker.ts`; the worker creates an `isolated-vm`
  V8 isolate for user code and its injected OCI facade. `src/isolation/pipe-execution.ts`
  carries length-prefixed, versioned JSON frames between the trusted host and
  worker.

  Trust boundary: the runner has no OCI credentials, config, SDK clients, MCP
  transport, host mounts, filesystem, network, environment, or Node built-ins.
  It receives only reflection metadata and a narrow OCI RPC bridge. The host
  treats worker frames as hostile, rejects malformed, oversized, and unsafe
  input, validates SDK-shaped requests, creates OCI clients with host credentials,
  owns deadlines and call/concurrency budgets, and sanitizes public OCI errors.
  OCI IAM remains a final backstop.

  Provider posture: Podman is the only implemented isolation provider and there
  is no process fallback. Each execution uses a fresh credential-free container
  with no network, read-only root filesystem, dropped capabilities,
  `no-new-privileges`, a non-root user, CPU, memory, process, file, and temporary
  filesystem limits, plus forced named cleanup. A normal Linux Podman container
  shares the host kernel and is not a VM boundary; deployments must supply any
  required VM-grade isolation and surrounding controls outside this server.

  Policy: the injected facade is SDK-shaped convenience, not enforcement. The
  host validates bridge messages and request shapes, permits only supported
  SDK-backed operations, creates clients with host authentication, and allows
  per-client `region` selection but not guest-provided endpoints, credentials,
  signers, retry configuration, or local utilities.

  Limits: code 1 MiB; timeout 1–120 seconds (30 default); result and each log
  stream 1 MiB; framed messages max 2 MiB; recursive decoder limits on depth,
  strings, arrays, keys, and nodes. Preserve SDK-native use: client construction
  supports only `region`; pagination uses request `page` and response
  `opcNextPage`; do not add convenience APIs without a demonstrated need.

  Primary sources: README.md; src/server.ts; src/sandbox.ts; src/oci-host.ts;
  src/protocol.ts; src/sandbox-isolate.ts; src/isolation/; and the tests in test/.

rules:
  proposal:
    - State which provider and execution mode are in scope, and whether the change affects the trusted host, untrusted runner, or their protocol.
    - Treat Podman as the sole in-server provider and do not introduce or imply a process fallback or provider-admission mechanism.
    - Identify effects on SDK operation exposure, client options, host credential isolation, deadline, call, concurrency, frame, and byte budgets.
    - Preserve the distinction between container isolation, the nested isolated-vm boundary, and VM-grade isolation supplied outside this server.
  design:
    - Trace the full flow from MCP tool through trusted host, Podman provider, framed channel, worker, isolated-vm facade, OCI host RPC, and cleanup.
    - Specify message schemas, frame and recursive-decoding limits, hostile-input handling, SDK request validation, public-error sanitization, cancellation, and deterministic teardown.
    - For a new provider, document guest credentials, mounts, network posture, resource limits, teardown behavior, and how deployment-level isolation requirements are met.
    - Keep the `oci` facade SDK-shaped and ergonomic, but never treat it as enforcement.
  specs:
    - Define success results and error behavior using result, error, stdout, stderr, exit_code, and timed_out fields where applicable.
    - Cover malformed, unknown-version, unknown-field, oversized, invalid-UTF-8, dangerous-key, and truncated protocol frames.
    - Cover direct raw-channel attempts after runner compromise, credential and Node-global isolation, unsupported client options, and cancellation or timeout cleanup.
  tasks:
    - Separate trusted broker, runner/facade, protocol, provider lifecycle, policy, docs, and tests whenever their boundary changes.
    - Include focused unit tests, MCP stdio integration tests, and adversarial protocol/provider tests for affected behavior.
    - For provider or isolation changes, include migration, rollback, deployment isolation implications, and real-provider evidence.

operations:
  apply:
    guidance:
      - Keep work self-contained in this server and do not resolve or modify unrelated merge conflicts.
      - Do not weaken Podman hardening, protocol validation, SDK request validation, public-error sanitization, credential isolation, or teardown guarantees without an explicit security rationale and tests.
      - Update README.md for changed environment variables, provider posture, security limitations, user-visible tool behavior, or local setup.
      - Run npm test, npm run coverage, npm run check, and npm run packcheck for server changes; use npm run ci when the worktree permits it. Coverage must remain at the configured 90% line threshold.
  archive:
    guidance:
      - Confirm the Podman capability and deployment isolation assumptions precisely, including shared-kernel limitations.
      - Summarize validation, adversarial coverage, cleanup/cancellation behavior, deployment assumptions, and any deferred provider work.
